<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <title>6-Axis Simulation</title>
</head>
<body>
    <h1>6-Axis Robot Simulation</h1>
    <div id="simulation-container">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="src/model.js"></script>
        <script src="src/simu.js"></script>
        <script src="src/controls.js"></script>
        <script src="src/mouseInput.js"></script>
        <script src="src/kinematics.js"></script>
    </div>
    <div id="controls" class="controls">
        <!-- Buttons for manual control of each axis grouped with a reading of the actual rotation in degrees with getRotationAngleInDegrees(axis) -->
        <div class="manualDegreeDiv">
            <button onmousedown="manualModeStart(0, 1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 1 +</button>
            <button onmousedown="manualModeStart(0, -1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 1 -</button>
            <p id="axis1-angle"></p>
        </div>
        <div class="manualDegreeDiv">
            <button onmousedown="manualModeStart(1, 1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 2 +</button>
            <button onmousedown="manualModeStart(1, -1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 2 -</button>
            <p id="axis2-angle"></p>
        </div>
        <div class="manualDegreeDiv">
            <button onmousedown="manualModeStart(2, 1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 3 +</button>
            <button onmousedown="manualModeStart(2, -1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 3 -</button>
            <p id="axis3-angle"></p>
        </div>
        <div class="manualDegreeDiv">
            <button onmousedown="manualModeStart(3, 1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 4 +</button>
            <button onmousedown="manualModeStart(3, -1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 4 -</button>
            <p id="axis4-angle"></p>
        </div>
        <div class="manualDegreeDiv">
            <button onmousedown="manualModeStart(4, 1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 5 +</button>
            <button onmousedown="manualModeStart(4, -1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 5 -</button>
            <p id="axis5-angle"></p>
        </div>
        <div class="manualDegreeDiv">
            <button onmousedown="manualModeStart(5, 1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 6 +</button>
            <button onmousedown="manualModeStart(5, -1)" onmouseup="manualModeEnd()" onmouseleave="manualModeEnd()">Axis 6 -</button>
            <p id="axis6-angle"></p>
        </div>
    </div>
    <div id="camera-controls" class="controls">
        <button onmousedown="switch_view('perspective')">Perspective</button>
        <button onmousedown="switch_view('top')">Top</button>
        <button onmousedown="switch_view('front')">Front</button>
        <button onmousedown="switch_view('right')">Right</button>
        <button onmousedown="switch_view('left')">Left</button>
        <button onmousedown="switch_view('back')">Back</button>
    </div>
    <div id="position-controls" class="controls">
        <h2>Move to Position</h2>
        <div class="row">
            <div class="column">
                <p>X: <span id="x-current">0</span></p>
                <p>Y: <span id="y-current">0</span></p>
                <p>Z: <span id="z-current">0</span></p>
            </div>
            <div class="column">
                <div>
                    <label for="x-target">X:</label>
                    <input type="number" id="x-target" value="0" step="1">
                    <label for="y-target">Y:</label>
                    <input type="number" id="y-target" value="0" step="1">
                    <label for="z-target">Z:</label>
                    <input type="number" id="z-target" value="0" step="1">
                </div>
                <div>
                    <label for="roll-target">Roll:</label>
                    <input type="number" id="roll-target" value="0" step="1">
                    <label for="pitch-target">Pitch:</label>
                    <input type="number" id="pitch-target" value="0" step="1">
                    <label for="yaw-target">Yaw:</label>
                    <input type="number" id="yaw-target" value="0" step="1">
                </div>
            </div>
            <button onclick="computeKinematics()">Create Permutations</button>
            <div>
                <label for="permutations-list">Permutations:</label>
                <select id="permutations-list" onchange="showPermutation(this.value)">
                    <option value="">-- Select Preset --</option>
                </select>
            </div>
        </div>
    </div>
</body>
</html>
